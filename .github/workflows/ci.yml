name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-test.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -r requirements-test.txt
      # Full suite; the CRF timing guard is deselected on shared runners.
      - run: python -m pytest tests/ -q --deselect tests/test_crf.py::test_nll_is_not_a_python_loop_over_the_batch
      # Release gates on the shipped weights, run explicitly so they show up by name.
      - run: python -m pytest tests/test_gates.py -q -rA
