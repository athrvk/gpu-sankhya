# Publishes gpu-sankhya to npm using npm's trusted publishing (OIDC) —
# no NPM_TOKEN secret is stored or used.
#
# There are two ways to publish:
#   1. Automatic: bump the "version" field in package.json and land the
#      change on master (e.g. `npm version patch` + push, or a PR that
#      edits package.json). The workflow compares that version against
#      what's already on npm and publishes only when it differs.
#   2. Manually via workflow_dispatch (publishes only if the version is not
#      on npm yet; otherwise just ensures the git tag exists).
#
# One-time setup:
#   1. Publish the package to npm manually once from a local machine:
#        npm publish
#      (trusted publishing can only be configured for a package that
#      already exists on the registry).
#   2. On npmjs.com, open the package page -> Settings -> Trusted
#      publisher, and add a GitHub Actions publisher with:
#        Organization or user: athrvk
#        Repository:           gpu-sankhya
#        Workflow filename:    publish.yml
#        Environment:          (leave blank)
#
# After that, publishing is fully automatic through either path above: the workflow builds, tests, and publishes with
# provenance, and tags the commit vX.Y.Z if that tag does not exist yet.

name: publish

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [package.json]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Decide whether to publish
        id: decide
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # push or workflow_dispatch: publish only if this version is not on npm yet
          PUBLISHED_VERSION="$(npm view gpu-sankhya@$VERSION version 2>/dev/null || true)"
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "gpu-sankhya@$VERSION already on npm, nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing (OIDC) requires npm >= 11.5.
      - name: Install latest npm
        if: steps.decide.outputs.publish == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: npm ci

      - name: Build
        if: steps.decide.outputs.publish == 'true'
        run: npm run build

      - name: Test
        if: steps.decide.outputs.publish == 'true'
        run: npm test

      # No auth token here: npm authenticates via OIDC trusted publishing.
      # Provenance is requested explicitly here (not in publishConfig) so a
      # manual `npm publish` from a laptop still works.
      - name: Publish to npm
        if: steps.decide.outputs.publish == 'true'
        run: npm publish --provenance

      # Tag the published commit (skipped when the tag already exists, e.g.
      # after `npm version` + `git push --follow-tags`).
      - name: Tag published commit
        run: |
          VERSION="${{ steps.decide.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists on origin"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
