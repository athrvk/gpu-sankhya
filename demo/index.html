<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>gpu-sankhya demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  textarea { width: 100%; height: 6rem; font-size: 1rem; padding: 0.5rem; box-sizing: border-box; }
  pre { background: #f5f5f5; padding: 1rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  .example { display: inline-block; margin: 2px; padding: 4px 8px; background: #eee; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
  h1 { font-size: 1.3rem; }
</style>
</head>
<body>
<h1>gpu-sankhya demo</h1>
<p>Type a Hinglish/Indian-English amount phrase below. Uses the bundled default weights.</p>
<div id="examples"></div>
<textarea id="input">bhai mujhe paune do lakh chahiye is mahine ke andar</textarea>
<pre id="output">loading...</pre>

<script type="module">
  import { parse } from "../dist/index.js";

  const examples = [
    "sava lakh",
    "dedh crore",
    "paune do lakh",
    "2.5L",
    "20k logon ne attend kiya",
    "2-3 lakh",
    "das hazaar crore",
    "Rs 500 only",
  ];
  const examplesDiv = document.getElementById("examples");
  for (const ex of examples) {
    const el = document.createElement("span");
    el.className = "example";
    el.textContent = ex;
    el.onclick = () => { input.value = ex; run(); };
    examplesDiv.appendChild(el);
  }

  const input = document.getElementById("input");
  const output = document.getElementById("output");

  function run() {
    try {
      const results = parse(input.value);
      output.textContent = JSON.stringify(results, null, 2);
    } catch (e) {
      output.textContent = "Error: " + e.message;
    }
  }

  input.addEventListener("input", run);
  run();
</script>
</body>
</html>
